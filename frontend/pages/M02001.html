<section class="project-intro page-section">
    <div>
        <span class="eyebrow">SURVEY PROJECTS</span>
        <h2>설문의 전체 생애주기를 관리합니다.</h2>
        <p>작성 중인 설문부터 배포·종료된 프로젝트까지 상태와 응답 흐름을 한곳에서 확인하세요.</p>
    </div>
    <button class="button button-primary" type="button" data-project-create>＋ 새 설문 프로젝트</button>
</section>

<section class="toolbar project-toolbar" aria-label="설문 프로젝트 검색 및 필터">
    <div class="toolbar-group project-status-tabs" role="tablist">
        <button type="button" role="tab" aria-selected="true" data-status-filter="all">전체 <span data-count-all>0</span></button>
        <button type="button" role="tab" aria-selected="false" data-status-filter="draft">작성 중</button>
        <button type="button" role="tab" aria-selected="false" data-status-filter="published">진행 중</button>
        <button type="button" role="tab" aria-selected="false" data-status-filter="closed">종료</button>
    </div>
    <div class="toolbar-group">
        <label class="search-field"><span class="sr-only">프로젝트 검색</span><input type="search" placeholder="설문 제목 검색" data-project-search></label>
        <select data-project-sort aria-label="정렬">
            <option value="updated">최근 수정순</option>
            <option value="created">생성일순</option>
            <option value="responses">응답 많은 순</option>
        </select>
        <div class="segmented-control" aria-label="보기 방식">
            <button type="button" aria-selected="true" data-view="grid" title="카드 보기">▦</button>
            <button type="button" aria-selected="false" data-view="list" title="목록 보기">☷</button>
        </div>
    </div>
</section>

<section class="project-content" data-project-content aria-live="polite">
    <div class="project-grid" data-project-grid>
        <article class="project-card skeleton"></article><article class="project-card skeleton"></article><article class="project-card skeleton"></article>
    </div>
</section>

<template data-project-card-template>
    <article class="project-card">
        <header class="project-card-head">
            <span class="status-badge"></span>
            <button class="icon-button project-more" type="button" aria-label="프로젝트 메뉴">•••</button>
        </header>
        <button class="project-card-main" type="button">
            <span class="project-category"></span>
            <h3></h3>
            <p></p>
        </button>
        <dl class="project-stats">
            <div><dt>문항</dt><dd data-stat-questions>0</dd></div>
            <div><dt>응답</dt><dd data-stat-responses>0</dd></div>
            <div><dt>완료율</dt><dd data-stat-rate>0%</dd></div>
        </dl>
        <footer class="project-card-footer"><span data-updated-at></span><div class="project-card-actions"></div></footer>
    </article>
</template>
